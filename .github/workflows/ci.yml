name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each job runs only once its component exists, so this workflow stays green
# while the repository is still a skeleton.
jobs:
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Test shell helpers
        run: ./scripts/test-load-env.sh

  api:
    name: Backend API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      SENTINEL_TEST_DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f backend/api/go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend/api
        run: |
          go vet ./...
          go test -count=1 ./...
      - if: steps.present.outputs.yes != 'true'
        run: echo "backend/api not created yet; skipping."

  worker:
    name: Backend worker (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      SENTINEL_TEST_DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f backend/worker/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.present.outputs.yes == 'true'
        working-directory: backend/worker
        run: uv run pytest -q
      - if: steps.present.outputs.yes != 'true'
        run: echo "backend/worker not created yet; skipping."

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: echo "yes=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.present.outputs.yes == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test --if-present
          npm run build --if-present
      - if: steps.present.outputs.yes != 'true'
        run: echo "frontend not created yet; skipping."
