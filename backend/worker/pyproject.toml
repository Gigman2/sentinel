[project]
name = "sentinel-worker"
version = "0.1.0"
description = "Sentinel analysis worker: leases analysis jobs and runs deterministic, evidence-cited rules."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
