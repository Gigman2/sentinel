name: sentinel

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel # local development only
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
