server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Look the API up through Docker's DNS on each request (cached 10 s), so
    # a recreated api container with a new address is found without
    # restarting this one. A variable in proxy_pass forces the lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    location /v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api;
    }

    # Vite puts a content hash in every file name under /assets/, so these
    # never change in place.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and any unhashed file: revalidate on every load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
